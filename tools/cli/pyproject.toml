[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-otp"
version = "0.1.0"
description = "CLI for the Ledger OTP app"
requires-python = ">=3.9"
dependencies = ["ledgercomm[hid]"]

[project.scripts]
ledger-otp = "ledger_otp.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ledger_otp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
