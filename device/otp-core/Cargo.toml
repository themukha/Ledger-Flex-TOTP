[package]
name = "otp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
arrayvec = { version = "0.7", default-features = false }
zeroize = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13", default-features = false }
